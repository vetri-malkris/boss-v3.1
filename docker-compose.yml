services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-boss}
      POSTGRES_USER: ${DB_USERNAME:-boss}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boss}
    ports:
      - "5432:5432"
    volumes:
      - boss_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-boss}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./boss-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-boss}
      DB_USERNAME: ${DB_USERNAME:-boss}
      DB_PASSWORD: ${DB_PASSWORD:-boss}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env, e.g. openssl rand -base64 48}
      JWT_ISSUER: ${JWT_ISSUER:-boss-platform}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./boss-web
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  boss_postgres_data:
