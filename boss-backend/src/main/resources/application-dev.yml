spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boss}
    username: ${DB_USERNAME:boss}
    password: ${DB_PASSWORD:boss}
  jpa:
    show-sql: false

boss:
  security:
    jwt:
      # Dev-only fallback so the app boots without extra setup on a fresh clone.
      # Never used outside the `dev` profile - application-prod.yml has no fallback.
      secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-32chars+}

logging:
  level:
    root: INFO
    com.boss: DEBUG
    org.hibernate.SQL: WARN
