spring:
  application:
    name: boss-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

boss:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:boss-platform}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
  data-retention:
    default-days: ${DATA_RETENTION_DEFAULT_DAYS:90}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] [tenant=%X{tenantId} user=%X{userId}] %logger{36} - %msg%n"
