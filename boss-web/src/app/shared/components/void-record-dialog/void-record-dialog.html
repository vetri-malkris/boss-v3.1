<h2 mat-dialog-title>Void record</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog">
    <p class="hint">
      This record won't be deleted - it stays available for audit, it just drops out
      of the everyday list. A reason is required.
    </p>
    @if (errorMessage(); as message) {
      <p class="error">{{ message }}</p>
    }
    <mat-form-field appearance="outline" class="field">
      <mat-label>Reason</mat-label>
      <textarea matInput rows="3" formControlName="reason"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()" [disabled]="submitting()">Cancel</button>
    <button mat-flat-button color="warn" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Void record
      }
    </button>
  </mat-dialog-actions>
</form>
