@if (loading()) {
  <p class="empty">Loading...</p>
} @else if (records().length === 0) {
  <p class="empty">No records entered yet.</p>
} @else {
  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          @for (field of schema().fields; track field.name) {
            <th>{{ field.label }}</th>
          }
          <th class="actions-header"></th>
        </tr>
      </thead>
      <tbody>
        @for (record of records(); track record.id) {
          <tr>
            @for (column of columns(); track column) {
              <td>{{ cell(record, column) }}</td>
            }
            <td class="actions">
              <button mat-icon-button type="button" aria-label="Edit record" matTooltip="Edit" (click)="edit(record)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button type="button" aria-label="Void record" matTooltip="Void" (click)="voidRecord(record)">
                <mat-icon>block</mat-icon>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
