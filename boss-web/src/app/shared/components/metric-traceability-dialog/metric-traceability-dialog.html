<h2 mat-dialog-title>{{ data.label }}</h2>
<mat-dialog-content class="dialog">
  <p class="row"><span class="row__label">Source</span><span>{{ data.source }}</span></p>
  <p class="row"><span class="row__label">Field(s) used</span><span>{{ data.fields }}</span></p>
  <p class="row"><span class="row__label">Formula</span><span>{{ data.formula }}</span></p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Close</button>
  @if (data.subcategory) {
    <button mat-flat-button color="primary" type="button" (click)="goToSubcategory()">
      Go to {{ data.subcategoryLabel }}
    </button>
  }
</mat-dialog-actions>
