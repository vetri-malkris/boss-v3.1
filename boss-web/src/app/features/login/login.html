<div class="login">
  <mat-card class="login__card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon class="login__logo">insights</mat-icon>
        BOSS
      </mat-card-title>
      <mat-card-subtitle>AI Business Decision Intelligence</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()" class="login__form">
        <mat-form-field appearance="outline" class="login__field">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="login__field">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (errorMessage(); as message) {
          <p class="login__error">{{ message }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="login__submit" [disabled]="submitting()">
          @if (submitting()) {
            <mat-spinner diameter="20" />
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
