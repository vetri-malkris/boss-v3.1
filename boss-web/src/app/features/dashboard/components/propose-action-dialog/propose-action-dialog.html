<h2 mat-dialog-title>Propose an action</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog">
    <mat-form-field appearance="outline" class="field">
      <mat-label>What will you do?</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Metric you expect to move</mat-label>
      <input matInput formControlName="expectedOutcomeMetric" placeholder="Monthly profit" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Expected change (e.g. +100000)</mat-label>
      <input matInput type="number" formControlName="expectedOutcomeValue" />
      <mat-hint>Recorded now so it can be compared against the actual result later.</mat-hint>
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="error">{{ message }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()" [disabled]="submitting()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Propose
      }
    </button>
  </mat-dialog-actions>
</form>
