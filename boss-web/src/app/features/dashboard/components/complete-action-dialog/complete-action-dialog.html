<h2 mat-dialog-title>Record the actual outcome</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog">
    <p class="expected">Expected: {{ data.expectedOutcomeMetric }} changes by {{ data.expectedOutcomeValue }}</p>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Actual change observed</mat-label>
      <input matInput type="number" formControlName="actualOutcomeValue" />
      <mat-hint>Variance (actual − expected) is computed automatically.</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Reason / learning (optional)</mat-label>
      <textarea matInput rows="3" formControlName="outcomeReason" placeholder="e.g. Expected savings were partially achieved."></textarea>
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="error">{{ message }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()" [disabled]="submitting()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Record outcome
      }
    </button>
  </mat-dialog-actions>
</form>
